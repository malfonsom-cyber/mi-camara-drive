<script>
    // PEGA AQUÍ TU URL DE LA IMPLEMENTACIÓN WEB
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwHV4DC9jqs3XawPL3hbmFr-5NVZDmcq3pts4xpWm_kUHsyu5NziIc238uLO39BVfwI/exec";

    const cameraInput = document.getElementById('cameraInput');
    const previewBox = document.getElementById('previewBox');
    const previewImg = document.getElementById('previewImg');
    const noteInput = document.getElementById('noteInput');
    const saveBtn = document.getElementById('saveBtn');
    const cameraBtn = document.getElementById('cameraBtn');
    const statusDiv = document.getElementById('status');

    let imagenBase64 = null;

    cameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // SOLUCIÓN AL ERROR DE MEMORIA: Crea una referencia ligera en vez de leer todo el archivo
      const imageUrl = URL.createObjectURL(file);

      // Reducimos un poco la resolución máxima a 1024 para aligerar aún más la carga
      optimizarImagen(imageUrl, 1024, 0.75, (base64Optimizada) => {
        imagenBase64 = base64Optimizada;
        previewImg.src = base64Optimizada;
        previewBox.style.display = 'block';
        noteInput.style.display = 'block';
        saveBtn.style.display = 'flex';
        cameraBtn.innerText = 'Tomar otra foto';
        statusDiv.innerText = '';
        noteInput.focus();

        // Liberamos la memoria RAM inmediatamente después de procesar la imagen
        URL.revokeObjectURL(imageUrl);
      });
    });

    function optimizarImagen(imgUrl, maxWidth, quality, callback) {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = imgUrl; // Dispara la carga
    }

    async function subirFoto() {
      if (!imagenBase64) return;

      if (URL_APPS_SCRIPT.includes("PEGA_AQUI")) {
        statusDiv.style.color = '#f87171';
        statusDiv.innerText = "Falta configurar la URL de Apps Script en el código.";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = 'Subiendo a Drive...';
      statusDiv.style.color = '#38bdf8';
      statusDiv.innerText = 'Guardando foto y nota en Google Drive...';

      const payload = {
        image: imagenBase64,
        note: noteInput.value
      };

      try {
        const response = await fetch(URL_APPS_SCRIPT, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const res = await response.json();

        if (res.status === 'success') {
          statusDiv.style.color = '#4ade80';
          statusDiv.innerText = '✅ ¡Guardado con éxito en Drive!';
          
          setTimeout(() => {
            previewBox.style.display = 'none';
            noteInput.style.display = 'none';
            noteInput.value = '';
            saveBtn.style.display = 'none';
            saveBtn.disabled = false;
            saveBtn.innerText = 'Guardar en Drive';
            cameraBtn.innerText = 'Tomar Foto';
            imagenBase64 = null;
            cameraInput.value = '';
            statusDiv.innerText = '';
          }, 2500);
        } else {
          throw new Error(res.message);
        }
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.innerText = 'Reintentar Guardar';
        statusDiv.style.color = '#f87171';
        statusDiv.innerText = 'Error al subir: ' + err.message;
      }
    }
  </script>
